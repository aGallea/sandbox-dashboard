name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write   # required to push to ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/agallea/sandbox-dashboard
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    runs-on: ubuntu-latest
    # The chart's default image tag is the appVersion, so publishing it before
    # the image exists would hand users a chart that cannot pull.
    needs: image
    permissions:
      contents: write   # attach install.yaml to the release
      packages: write   # push the chart to ghcr
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Tag, chart version and appVersion must agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CHART=$(grep '^version:' deploy/helm/sandbox-dashboard/Chart.yaml | awk '{print $2}')
          APP=$(grep '^appVersion:' deploy/helm/sandbox-dashboard/Chart.yaml | awk '{print $2}' | tr -d '"')
          echo "tag=$TAG chart=$CHART appVersion=$APP"
          if [ "$TAG" != "$CHART" ] || [ "$TAG" != "$APP" ]; then
            echo "::error::Tag $TAG, chart version $CHART and appVersion $APP must match before release."
            exit 1
          fi

      - name: Package and push the chart
        run: |
          # An OCI reference must be lowercase and github.repository_owner is not
          # guaranteed to be: helm push rejects "aGallea/charts" as an invalid
          # reference. The image escapes this only because metadata-action
          # lowercases on its own.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm package deploy/helm/sandbox-dashboard --destination dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} --password-stdin
          helm push dist/sandbox-dashboard-*.tgz "oci://ghcr.io/$OWNER/charts"

      - name: Attach install.yaml and the chart to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deploy/install.yaml
            dist/sandbox-dashboard-*.tgz
