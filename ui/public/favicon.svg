<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="sandbox-dashboard">
  <!--
    A simplified reading of the app illustration, drawn for 16px.

    The illustration is an app icon: at 16px its monitor, pod network, palm and
    sandcastle collapse into a teal-and-tan smudge. This keeps the three things
    that still read at that size and happen to be the whole idea — the teal tile,
    the sand, and a pod sitting on it. Colours are sampled from the illustration.

    Every shape is at least 2 units, which is a whole pixel at 16px, so nothing
    dissolves into grey. An earlier draft used the sandcastle's three towers;
    rasterised small they read as a bar chart, so the pod won instead.
  -->
  <defs>
    <clipPath id="tile">
      <rect x="2" y="2" width="28" height="28" rx="5.5"/>
    </clipPath>
  </defs>

  <rect width="32" height="32" rx="7" fill="#2c7a8b"/>
  <rect x="2" y="2" width="28" height="28" rx="5.5" fill="#8ecbc8"/>

  <g clip-path="url(#tile)">
    <!--
      Sand: a dune line, not a straight edge, so it reads as a beach. It rises
      where the pod stands — with the dip there the pod looked like it was
      hovering rather than sitting in the sand.
    -->
    <path d="M2 21C6 18.6 11 18 16 18.2c5 .2 9 2.1 14 1.4V30H2z" fill="#ecc998"/>

    <!-- The pod, standing in the sand: a sandbox with something running in it -->
    <rect x="10.5" y="11.5" width="11" height="10" rx="1.6" fill="#4f9d47"/>
    <rect x="10.5" y="11.5" width="11" height="3.4" rx="1.6" fill="#7cc06f"/>
    <rect x="10.5" y="13.5" width="11" height="1.4" fill="#7cc06f"/>
  </g>
</svg>
