{{- if and .Values.openSandbox.apiKey (not .Values.openSandbox.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sandbox-dashboard.osbSecretName" . }}
  labels:
    {{- include "sandbox-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.openSandbox.existingSecretKey }}: {{ .Values.openSandbox.apiKey | quote }}
{{- end }}
