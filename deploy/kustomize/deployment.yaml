apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox-dashboard
  labels:
    app.kubernetes.io/name: agent-sandbox-dashboard
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-sandbox-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-sandbox-dashboard
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: agent-sandbox-dashboard
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # imagePullSecrets:
      #   - name: ghcr-pull   # uncomment if the image is in a private GHCR package
      containers:
        - name: dashboard
          image: ghcr.io/aGallea/agent-sandbox-dashboard:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - "--listen-addr=:8080"
            # Set PROMETHEUS_URL via env to enable the metrics page.
            # - "--prometheus-url=http://prometheus.monitoring.svc:9090"
          env:
            - name: PROMETHEUS_URL
              value: "http://CHANGE_ME:9090"   # operator overrides via patch
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
