apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-dashboard
  labels:
    app.kubernetes.io/name: sandbox-dashboard
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-dashboard
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: sandbox-dashboard
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # imagePullSecrets:
      #   - name: ghcr-pull   # uncomment if the image is in a private GHCR package
      containers:
        - name: dashboard
          image: ghcr.io/aGallea/sandbox-dashboard:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - "--listen-addr=:8080"
          # To enable the metrics page, add the PROMETHEUS_URL env var via a
          # kustomize overlay or patch. Without it the /metrics endpoint
          # returns 503 problem+json and the UI shows a placeholder.
          # env:
          #   - name: PROMETHEUS_URL
          #     value: "http://prometheus.monitoring.svc:9090"
          # Optional OpenSandbox integration. Uncomment to show OpenSandbox's own
          # lifecycle state next to the Kubernetes Ready condition. The API key is
          # read from a Secret you create; the dashboard never reads Secrets via the
          # API server, so no extra RBAC is needed.
          # env:
          #   - name: OPENSANDBOX_URL
          #     value: "http://opensandbox-server.default.svc"
          #   - name: OPENSANDBOX_API_KEY
          #     valueFrom:
          #       secretKeyRef:
          #         name: opensandbox-server-api-key
          #         key: api-key
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
