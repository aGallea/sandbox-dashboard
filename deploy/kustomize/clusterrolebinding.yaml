kind: ClusterRoleBinding
metadata:
  name: sandbox-dashboard
  labels:
    app.kubernetes.io/name: sandbox-dashboard
    app.kubernetes.io/component: dashboard
subjects:
  - kind: ServiceAccount
    name: sandbox-dashboard
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-dashboard
